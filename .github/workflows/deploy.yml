name: Deploy to Azure App Service

on:
  push:
    branches: [main]
    # Docs-only pushes do not need a new deployment. App code, deployment
    # tooling and this workflow trigger a deploy; use workflow_dispatch for
    # anything else.
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.build.json'
      - 'nest-cli.json'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload deployable artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          if-no-files-found: error
          retention-days: 3
          path: |
            package.json
            package-lock.json
            tsconfig.json
            tsconfig.build.json
            nest-cli.json
            src
            dist

  deploy:
    name: Deploy to production
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app
          path: app

      - name: Validate deployment configuration
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          missing=0
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_WEBAPP_NAME; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing. See README '配置 GitHub Actions（OIDC）'."
              missing=1
            fi
          done
          exit "$missing"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # App Service has SCM_DO_BUILD_DURING_DEPLOYMENT=true, so Oryx runs
      # `npm install && npm run build`, then starts the app with `npm start`.
      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: app

      # F1 cold starts and Oryx builds can take a minute or two. Fail the
      # workflow if the app never becomes healthy (DB connectivity included).
      - name: Verify health endpoint
        env:
          APP_URL: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
        run: |
          for attempt in $(seq 1 18); do
            status=$(curl -s -o /tmp/health.json -w '%{http_code}' \
              --max-time 30 "$APP_URL/api/health" || true)
            if [ "$status" = "200" ]; then
              echo "Health check passed on attempt $attempt:"
              cat /tmp/health.json
              exit 0
            fi
            echo "Attempt $attempt: HTTP $status"
            sleep 10
          done
          echo "::error::Deployment did not become healthy within 3 minutes."
          cat /tmp/health.json 2>/dev/null || true
          exit 1